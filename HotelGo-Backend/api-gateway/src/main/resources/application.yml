server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Route 1: Auth Service
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

# Logging
logging:
  level:
    com.hotelgo.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
